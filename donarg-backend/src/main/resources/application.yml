spring:
  application:
    name: donarg-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/donar_v2
    username: postgres
    password: admin

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "0"

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

# Config propia de la app (a completar a medida que se necesite)
donarg:
  # zona de radio por defecto para buscar publicaciones cercanas, en km
  radio-busqueda-default: 5
  imagenes:
    # carpeta donde se guardan los archivos subidos (relativa a donde corre el backend)
    directorio: uploads/imagenes
